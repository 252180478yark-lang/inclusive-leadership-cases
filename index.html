</script><script>const DATA={"bosch":[{"id":"women","label":["女性人才怎样进入领导岗位","How women enter the leadership pipeline"],"fact":["2020 年，霍普发起“多元化驱动业务”项目，李晓虹加入六人团队。博世要求关键岗位每四位候选人至少有一名女性。李晓虹又在中国担任女性领导者的导师，与员工讨论职业选择，也讨论家庭责任。","Katharina Hopp launched Diversity Drives Business in 2020, and Rosa Lee joined the six-person team. Bosch required at least one woman in four candidates for key positions. In China, Lee mentored aspiring female leaders on careers and family commitments."],"analysis":["扩大提名范围，让过去可能被遗漏的人进入遴选。辅导和灵活办公则回应另一个问题：获得机会后，员工能否在承担家庭责任的同时继续发展？","Broadening nominations changes who gets considered. Mentoring and flexible working address a different question. Once an opportunity exists, can people pursue it alongside family responsibilities?"],"limit":["候选名单与最终任命是两项指标。2021 年 18.4% 是集团层面女性高管占比。案例没有给出这项提名规则实施后的晋升率或留任率。","A place on a shortlist and an appointment are different measures. The 18.4% figure in 2021 describes female executives at group level. The case gives no subsequent promotion or retention rate attributable to the rule."],"ev":[{"doc":"bc","p":1,"q":"4位候选人至少有 1位女性","note":["关键岗位的提名规则。","The nomination rule for key positions."]},{"doc":"be","p":1,"q":"the company required at least one in four candidates","note":["关键岗位须纳入女性候选人。","Women had to be represented among candidates for key positions."]},{"doc":"bc","p":8,"q":"作为博世中国女性领导者辅导项目的导师","note":["李晓虹本人担任导师。","Lee personally served as a mentor."]},{"doc":"be","p":6,"q":"As a mentor in Bosch China’s leadership program for rising women leaders","note":["英文版记载了她与潜在女性领导者的辅导工作。","The English edition describes her mentoring of emerging women leaders."]}]},{"id":"voice","label":["董事席位与非正式决策","A board seat and informal influence"],"fact":["2019 年，李晓虹成为博世中国董事会首位女性成员。她数次婉拒周末高尔夫邀约，后来才意识到同事已在球场上就部分工作问题形成共识。她随后更主动地经营同事关系。","In 2019, Lee became Bosch China’s first female board member. After declining several weekend golf invitations, she realised colleagues had reached agreement on work issues there. She began investing more time in relationships."],"analysis":["获得席位让她能出席会议。能否影响决定，还取决于她能否及时接触议题。若把会前讨论带回全体成员都能参与的场合，同样能发挥专业判断的人就有更多发言机会。","A board seat gave Lee formal access. Influence also depended on hearing about issues before a consensus formed. Bringing such conversations back to a forum open to everyone could let more members contribute their judgment."],"limit":["这是李晓虹对自身经历的回顾。案例未说公司后来改变了决策程序，也无法由此推断每位女性都应参加球局。","The account is Lee’s retrospective. The case reports no subsequent change to board procedures and offers no basis for prescribing golf to female executives."],"ev":[{"doc":"bc","p":7,"q":"有些工作上的讨论，是他们在球场上达成","note":["球场谈话对正式决策有影响。","Some consensus formed during informal interactions."]},{"doc":"be","p":6,"q":"a valuable opportunity to discuss work issues and reach a consensus.","note":["李晓虹回顾自己错过的交流。","Lee reflected on conversations she had missed."]},{"doc":"bc","p":8,"q":"李晓虹开始注重关系的建立和维系","note":["她改变了自己的交往方式。","She changed how she maintained professional relationships."]}]},{"id":"glocal","label":["让本地经验进入总部决策","Bringing local knowledge to headquarters"],"fact":["2015 年，李晓虹调任德国总部负责全球人力资源。她走访各业务部门，请一线同事解释客户需要什么，并鼓励团队参加外部研讨会，把市场变化带回人力资源工作。","Lee moved to the German headquarters in 2015 to lead global HR. She visited business units to learn what their customers needed and encouraged her team to attend external seminars and bring market insights back into HR work."],"analysis":["跨文化团队拥有不同经验，但这些经验要进入决策，还需要具体渠道。拜访业务部门，使本地客户需求能够影响总部的政策设计，也让总部有机会检验自己的假设。","Different backgrounds bring different experiences. They influence decisions only if there is a channel for them. Unit visits gave local customer needs a route into HR policy and let headquarters test its assumptions."],"limit":["李晓虹描述了工作方式上的分歧及随后的理解。这段经历不能代表所有中德员工，也没有量化政策变化对销售或创新的影响。","Lee describes disagreement and growing understanding within her team. The episode does not establish national traits or quantify effects on sales or innovation."],"ev":[{"doc":"bc","p":5,"q":"李晓虹到各个业务部门走了一圈","note":["走访让总部人员直接听到业务部门的需求。","The visits connected headquarters with business units."]},{"doc":"be","p":4,"q":"Lee visited every unit in person","note":["她亲自到各部门了解情况。","Lee made the visits herself."]}]},{"id":"connectory","label":["如何支持非本部门的创新提案","Sponsoring an idea from another function"],"fact":["博克在芝加哥发现创业社区 1871，向总部申请增加两个 IT 岗位。李晓虹请他当面说明，并邀请其他部门负责人参加。中文版记载她当场特批。2017 年，博世与 1871 建立 Chicago Connectory，供创业者与企业合作。","Dennis Boecker encountered the 1871 startup community in Chicago and requested two new IT positions. Lee brought him together with a department head to hear the proposal. The Chinese edition says she approved the exception on the spot. In 2017, Bosch and 1871 opened the Chicago Connectory for collaboration."],"analysis":["创意来自博克。李晓虹发挥的作用，是让一个受编制限制的部门能把提案带到有审批权的人面前。鼓励发声只有在意见可以获得讨论、资源或明确回应时才有实际作用。","Boecker originated the idea. Lee gave a function constrained by headcount rules access to people able to approve it. An invitation to speak is more meaningful when a proposal can receive a hearing, resources or a clear response."],"limit":["平台落地是案例明确记载的结果。没有每个项目的投入、收益和对照数据，仍无法判断这次例外审批的投资回报。","The platform’s launch is documented. Without project-level costs, returns and a comparison, its return on the staffing exception is unknown."],"ev":[{"doc":"bc","p":6,"q":"于是当场特批了博克的申请。","note":["中文版明确记载李晓虹作了特殊批准。","The Chinese edition explicitly describes Lee approving the exception."]},{"doc":"be","p":5,"q":"only one department head could attend.","note":["虽在两天内临时安排，仍有一名部门负责人参加。","One department head could attend the meeting arranged on two days’ notice."]},{"doc":"be","p":5,"q":"Bosch joined forces with 1871 to launch the “Chicago Connectory,”","note":["英文版记录了合作平台的成立。","The English edition records the launch with 1871."]}]},{"id":"lab","label":["让员工参与工作设计","Giving employees a say in work design"],"fact":["2017 年下半年，李晓虹在电动工具事业部建立 HR Lab，从财务、销售、生产等部门借调员工。“个人发展对话”让员工邀请三至五名同事提供反馈；在特定项目中，员工也能参与选择主管与同事。","In the second half of 2017, Lee set up the HR Lab in Power Tools and drew staff from finance, sales and production. Employees could invite three to five colleagues to give development feedback and help choose supervisors and coworkers for specific projects."],"analysis":["熟悉日常工作的人往往知道，谁真正了解自己的贡献，以及项目需要哪些技能。让员工能挑选反馈者和项目伙伴，改变了原先由上级主导的评估与配置方式。","Frontline employees know who sees their contributions and what skills a project needs. Giving them a choice of feedback partners and project colleagues redistributed decisions that supervisors had traditionally made."],"limit":["“发展导航”因数据保护和 IT 问题未实施。中文版另记载，因业务增长效果难证且 IT 支持不足，HR Lab 于 2019 年初暂停，部分员工仍在使用已推出的产品。","Development Navigator failed because of data protection and IT constraints. The Chinese edition adds that the Lab paused in early 2019 amid unproven business impact and limited IT support, while some employees continued using its tools."],"ev":[{"doc":"bc","p":6,"q":"汇聚了财务、销售、生产及其他各个领域的多元人才","note":["跨职能借调员工共同设计产品。","Seconded staff brought varied functional experience."]},{"doc":"be","p":5,"q":"the right to choose their immediate supervisors and coworkers for specific projects","note":["参与选人限于具体项目场景。","The choice applied to specific projects."]},{"doc":"bc","p":7,"q":"HR Lab 按下了暂停键","note":["中文版明确记录了项目暂停。","The pause is documented in the Chinese edition."]},{"doc":"be","p":5,"q":"“Development Navigator” failed due to data protection and IT issues.","note":["英文版也记录了具体产品未能实施。","The English edition identifies a particular product that failed."]}]},{"id":"digital","label":["数字人才如何在技术岗位晋升","Career progression for digital specialists"],"fact":["李晓虹的团队走访业务主管、对标数字企业，界定了 67 个数字化角色并访谈人才。DigiTalent 为技术人员设置向首席专家发展的通道，与管理通道提供可比待遇和地位。Skill Hub 则让员工跨部门参与匹配其技能的项目。","Lee’s team consulted unit managers, benchmarked digital firms, defined 67 digital roles and interviewed talent. DigiTalent established a route to chief expert with standing and rewards comparable to management. The Skill Hub matched employees with project work across departments."],"analysis":["技术人员可以通过解决更难的技术问题获得认可。把这种路径写进岗位和薪酬制度，减少了“想晋升就必须管人”的压力，也为业务部门保留专业能力。","Technical specialists could gain recognition by solving harder technical problems. A formal track with corresponding rewards reduces pressure to manage people as the price of promotion and may help units retain expertise."],"limit":["67 是角色类型数。案例描述了职业通道的设计，未报告不同通道实际晋升的人数、工资分布或留任变化。","The 67 refers to role types. The case describes a career structure without reporting actual promotions, pay distributions or retention changes by track."],"ev":[{"doc":"bc","p":10,"q":"最终确定了 67个数字化角色","note":["口径是角色类型。","The unit is role types."]},{"doc":"be","p":7,"q":"the same remuneration, status, and career development opportunities as managers.","note":["技术通道与管理通道在制度上可比。","The technical and managerial tracks were designed to offer comparable rewards."]},{"doc":"bc","p":10,"q":"任何一个对此感兴趣的跨部门员工，都可以来申请承接这个任务","note":["技能中心让员工申请跨部门项目工作。","Employees could apply for cross-functional work through the hub."]}]},{"id":"incentives","label":["如何为稀缺技能与创新付酬","Rewarding scarce skills and innovation"],"fact":["博世中国的人力资源团队开发 DigiPay，对标数字岗位的市场薪资并跟踪薪资区间。另一个项目 Incentive for Growth 把部分奖励与创新项目试验成功挂钩，参与者还有机会组建团队负责后续落地。","Bosch China’s HR team introduced DigiPay to benchmark digital salaries and track pay ranges. A separate initiative, Incentive for Growth, offered a reward after an innovation project passed testing and an opportunity for participants to form its implementation team."],"analysis":["前者帮助招聘人员判断外部报价。后者让项目贡献者分享试验成功的收益。分析公正性时须先弄清差额究竟来自市场技能溢价，还是来自已经达到的项目里程碑。","DigiPay informs recruiting offers. The project incentive lets contributors share in successful trials. To judge fairness, separate a market premium for scarce skills from a reward for achieving a milestone."],"limit":["市场对标工具本身不会决定在职员工如何调薪。案例也未报告项目奖励覆盖的人群、金额或投资回报。","Market benchmarks do not by themselves set existing employees’ pay. The case does not report the recipients, amounts or return on the innovation awards."],"ev":[{"doc":"bc","p":10,"q":"薪酬对标数字化工具——DigiPay","note":["工具用于数字岗位薪酬的市场对标。","The tool benchmarks pay for digital roles."]},{"doc":"be","p":8,"q":"DigiPay for benchmarking digital talent compensation against market rates.","note":["英文版明确比较对象是市场标准。","Market rates are the benchmark."]},{"doc":"bc","p":11,"q":"可以得到一部分奖励资金，同时还有机会成立项目创始人团队","note":["通过试验后可获得奖金及后续项目机会。","Successful testing could lead to an award and a role in implementation."]},{"doc":"be","p":8,"q":"Once the innovation project was successfully tested","note":["英文版把试验成功列作支付条件。","The English edition identifies successful testing as the condition."]}]},{"id":"paygap","label":["老员工为何质疑新人的工资","Why existing employees challenged new-hire pay"],"fact":["在职工大会上，一名员工直接问高管，为什么长期服务的员工收入明显低于新来的人。中文案例指出部分事业部新聘数字人才的工资与在职员工形成两三倍差距，软件事业部的员工流动率达到过去的三倍。","At a town hall, an employee asked senior leaders why long-serving staff were being paid less than newcomers. Some business units offered digital recruits market pay, described as two to three times existing pay. Software employee turnover reached three times its earlier level."],"analysis":["招聘方用外部市场作参照，同岗位老员工则会比较彼此的投入与待遇。一种报价可以帮助招到新人，同时削弱留下来的意愿。应比较职责、技能、地点和绩效相近的岗位，再判断哪里存在需要纠正的差额。","Recruiters compare offers with the external market. Incumbents compare their treatment with colleagues doing similar work. An offer can attract a recruit and undermine an incumbent’s willingness to stay. Match roles on responsibility, skills, location and performance before identifying gaps to correct."],"limit":["两三倍指部分事业部的新老员工薪差；三倍是软件事业部流动率相对过去的变化。案例没有给出全部员工的同岗调整后差距，也没有分离薪差对离职的因果作用。","The two-to-three multiple describes pay differences in some units. The threefold figure describes a change in software turnover. The case gives neither a companywide like-for-like gap nor an estimate of the pay gap’s independent effect on departures."],"ev":[{"doc":"bc","p":2,"q":"为什么新员工的工资比我们的高很多？","note":["一名在职员工在大会上直接质疑差异。","An incumbent voiced the concern directly at the town hall."]},{"doc":"be","p":2,"q":"why do new employees get paid so much more than we do?","note":["这是员工提出的问题。","This was the employee’s own question."]},{"doc":"bc","p":11,"q":"软件事业部的员工流动率是过去的 3倍","note":["此处的三倍是流动率相对过去的倍数。","The multiple compares turnover with its previous level."]},{"doc":"be","p":8,"q":"two to three times higher than existing salaries","note":["部分业务部门按市场水平招聘产生的薪差。","Some units reported this gap for market-rate hires."]}]},{"id":"decision","label":["调薪决定要回答什么","What the pay decision must resolve"],"fact":["博世中国高管有两种看法：有人希望用灵活工作与发展机会留人，有人强调一线城市需要按市场报价抢人。李晓虹的团队估算，关键员工流失后的替补成本可达原来的 4.7 倍，但整体追平市场需要大额预算，利润率下降也增加了争取总部支持的难度。","Bosch China executives differed. Some emphasised flexible work and opportunities to develop. Others stressed market pay in expensive first-tier cities. Lee’s team put replacement cost for key departures at 4.7 times the original cost. Broad market adjustments would require a large budget as profitability fell and headquarters support was uncertain."],"analysis":["决策者可比较三种选择：维持现有结构并改善工作安排、优先调整差额最大且难替代的岗位、普遍调薪。用预算、同岗薪差、关键岗位流失及项目延误同时检验取舍，并向新老员工说明调整依据。","Managers could compare three choices: keep current pay and improve working arrangements, correct the largest gaps in hard-to-replace roles, or raise pay broadly. Compare cost, like-for-like gaps, critical departures and project delays, then explain the criteria to incumbents and recruits."],"limit":["这些选项属于讨论方案。案例以三个问题收尾：怎样处理不公平、是否调整在职员工薪资、怎样确认调整有助业务。未给出最终决定或实施后的经营结果。","These are discussion options. The case closes by asking how to address unfairness, whether to adjust existing pay, and how to know the change helps the business. It gives no final decision or post-implementation result."],"ev":[{"doc":"bc","p":11,"q":"重新补充人员的成本将是原来的 4.7倍","note":["团队对关键员工离开后的替补成本作了估算。","The team estimated the cost of replacing key employees."]},{"doc":"be","p":8,"q":"adjusting wages in line with market rates required a large budget","note":["全面调整还需要预算和总部支持。","Broad adjustments required funding and headquarters support."]},{"doc":"bc","p":11,"q":"如何确保这样的调整对业务是有帮助的呢？","note":["案例作者将业务影响留给读者判断。","The authors leave the business impact open."]},{"doc":"be","p":9,"q":"Should the pay levels of existing employees be adjusted?","note":["英文版同样以开放问题结束。","The English edition likewise leaves the decision open."]}]}],"loreal":[{"id":"mission","label":["谁能判断消费者需要什么？","Who gets to interpret consumer needs?"],"fact":["2018 年 3 月，Le Grand 准备与 CEO 讨论三个难题：女性进入最高层、新兴市场人才晋升，以及从入职起就在欧莱雅成长的内部人文化。公司要服务不同文化中的美妆需求，高层却仍多为法国男性，许多人毕业于精英院校并长期在公司任职。","In March 2018, Le Grand was preparing to discuss women’s advancement, leaders from emerging markets and the firm’s grow-your-own culture with the CEO. The company served consumers across cultures, yet many senior leaders were French men with elite educations who had spent their careers at L’Oréal."],"analysis":["如果产品决策者共享相近的经历，他们可能误判不同市场的使用场景。让当地人才参与产品取舍，比只统计团队内有多少种国籍更接近“Beauty for All”的业务问题。","Leaders with similar backgrounds may miss how customers elsewhere use a product. Giving local talent a say in product decisions directly tests the business promise behind “Beauty for All.”"],"limit":["这里给出的是经营理由。案例没有把某款产品的销售或研发成果归因于团队构成。","This is a business rationale. The case does not attribute specific sales or research outcomes to team composition."],"ev":[{"doc":"lo","p":2,"q":"the gap in emerging market leaders","note":["管理层本身将新兴市场领导人才的缺口列入议程。","The emerging-market leadership gap was on management’s agenda."]},{"doc":"lo","p":8,"q":"our teams have to reflect that","note":["西欧消费品事业部 HR 负责人把团队构成与认识新市场消费者联系起来。","The Western Europe consumer products HR director linked team composition to understanding newer markets."]}]},{"id":"workplace-access","label":["从残障包容到工作与家庭支持","Making work accessible and supporting families"],"fact":["法国团队在 1990 年代初从残障员工融入着手，后来形成残障、性别、社会经济及多元文化出身三个工作重点。部分工厂改造了生产线，集团规定至少 14 周产假、11 天陪产假。","The French operation began disability inclusion work in the early 1990s. Disability, gender, and socioeconomic and multicultural origins became three areas of focus. Some factories adapted production lines. The group set minimum leave of 14 weeks for maternity and 11 days for paternity."],"analysis":["生产线设计改变了谁能承担一项工作。假期使用率、休假后的回岗安排和主管态度，则是判断假期政策能否帮助照护者持续发展的后续问题。","Production-line design affects who can perform a job. Leave uptake, return-to-work arrangements and managers’ responses are further questions when assessing career continuity for caregivers."],"limit":["案例确认政策存在，没有提供工厂改造覆盖率、员工假期使用率或休假后的晋升数据。","The case establishes that these provisions existed. It supplies no plant coverage rate, leave uptake or post-leave promotion data."],"ev":[{"doc":"lo","p":5,"q":"manufacturing lines specifically intended to include employees with disabilities","note":["案例限定为部分工厂。","The account refers to some factories."]},{"doc":"lo","p":5,"q":"minimum maternity leave of 14 weeks and paternity leave of 11 days","note":["这里的天数是公司政策下限。","These were company minimums."]}]},{"id":"implementation","label":["培训开展后，谁参与业务决策？","After training, who advises on business decisions?"],"fact":["七人的全球 D&I 团队与各国 HR 和业务负责人合作。一天制工作坊使用共同课程并在当地调整。到 2018 年，35 个国家开设工作坊，全球累计超过 28,000 名员工受训。巴西参与者提出为视障消费者制作线上化妆教程。两宗模特合作风波中，D&I 办公室都未参与签约或终止合作的咨询。","The seven-person global D&I team worked with local HR and business champions. Its one-day workshops adapted a common curriculum to each location. By 2018, 35 countries offered them and more than 28,000 staff had been trained worldwide. Participants in Brazil proposed an accessible makeup tutorial. The D&I office was not consulted on contracting or ending the two model engagements discussed."],"analysis":["培训能让员工从消费者角度提出具体改进。若品牌团队在选人和处理争议时没有固定咨询途径，培训的覆盖面与决策中的实际影响力仍会脱节。","Training can surface concrete consumer needs. Without a reliable route for brand teams to seek advice, broad training reach can coexist with little influence at a sensitive decision point."],"limit":["累计受训人数不能说明日常行为改变了多少。两个品牌事件揭示了流程缺口，不能推算所有营销项目的咨询率。","A cumulative attendance count does not measure behaviour change. Two episodes identify a process gap, but cannot establish the consultation rate for all campaigns."],"ev":[{"doc":"lo","p":6,"q":"more than 28,000 employees had received training worldwide","note":["这是截至 2018 年的培训覆盖量。各地面临预算和优先级制约。","This is cumulative training reach by 2018. Local teams also faced budget and prioritisation constraints."]},{"doc":"lo","p":6,"q":"Neither the contracting nor halting of the work of these models was conducted with the D&I office’s advice.","note":["原句以 Neither 开头，明确两位模特的签约与终止合作均未咨询该部门。","The sentence begins with “Neither” and states that the office was not consulted on contracting or ending these engagements."]}]},{"id":"gender-progression","label":["为什么有家庭政策，女性仍会离开？","Why did women still leave despite family policies?"],"fact":["在英国及爱尔兰，离职面谈显示，一些女性生育首个或第二个孩子后离开，难以想象育儿与高强度工作并行。团队设立家长互助网络，并由在职母亲辅导年轻女性。德国负责人 Roos 公开说明自己会在家办公，并推出弹性工时。","In the UK and Ireland, exit interviews identified women leaving after a first or second child because combining caregiving with intense work seemed untenable. The team set up a parents’ network and sought mothers as mentors. In Germany, Roos openly discussed working from home and introduced flexible hours."],"analysis":["经理公开使用弹性安排，让员工看到承担照护责任仍可担任高层。对希望晋升的人，导师能提供建议，主管还可通过任命权提供真正的管理机会。","When a senior manager visibly uses flexibility, employees can see how caregiving and leadership might coexist. A mentor can offer advice. A supervisor with appointment authority can also open a real management role."],"limit":["这些是地区实践和访谈见闻。材料没有比较实施前后女性离职率，也没有把集团女性领导比例变化归因于这些做法。","These are local practices and interview accounts. No before-and-after attrition rates or attribution to group-wide representation changes are provided."],"ev":[{"doc":"lo","p":7,"q":"they would often resign after their first or second child","note":["英爱 HR 负责人用离职面谈追查女性流失的具体时点。","The former UK and Ireland HR director used exit interviews to locate where women were leaving."]},{"doc":"lo","p":7,"q":"an initiative that offered employees flexible working hours","note":["德国的 Our Time 将负责人示范的工作方式延伸给员工。","Germany’s Our Time initiative extended flexible hours to employees."]}]},{"id":"regional-pipeline","label":["当地骨干如何进入集团接班名单？","How can local talent reach group succession slates?"],"fact":["亚太区负责人跟踪约 250 名区域人才，每年为各事业部和职能部门亲自主持三至四次接班讨论，并向巴黎总部推荐亚洲人才。印度籍内部经理 Vismay Sharma 先后领导印尼和英国业务，成为首位担任英国负责人职务的亚洲人。","The Asia Pacific head tracked about 250 people in his talent pool, personally reviewing succession three to four times a year for each division and corporate function. He advocated for Asian talent in Paris. Vismay Sharma, an Indian internal appointee, led Indonesia and later became the first Asian head of the UK business."],"analysis":["定期讨论让区域人才反复出现在任命者眼前。让候选人负责关键市场，可以积累经营经验，也给总部提供评价其领导能力的实际材料。","Repeated reviews keep local candidates visible to people who make appointments. Responsibility for a key market builds operating experience and gives headquarters direct evidence of leadership."],"limit":["亚太区的 250 人是区域人才池，集团的“前 250”是战略岗位口径。个案任命也不足以估计亚洲候选人的整体晋升概率。","The regional pool of 250 people is distinct from the group’s top 250 strategic positions. One appointment cannot estimate promotion odds for all Asian candidates."],"ev":[{"doc":"lo","p":8,"q":"three to four times per year","note":["亚太负责人说明每个事业部和职能部门的接班讨论频次。","The Asia Pacific head gave this frequency for each division and corporate function."]},{"doc":"lo","p":13,"q":"he was the first Asian to be appointed as Head of UK","note":["导师以 Sharma 的两次跨国任命说明支持区域人才的做法。","Sharma’s mentor described his moves to the Indonesian and UK businesses."]}]},{"id":"mobility","label":["跨国任职的机会与家庭成本","International careers and the cost of mobility"],"fact":["外派曾是晋升的重要一步。集团开始将培养当地人才、提高国际团队多样性列为安排外派的理由，也鼓励同区域内调动。2018 年约有 1,050 名外派员工，女性占 43%。来自法国机构的外派占 34%，从其他国家派往法国总部占 30%，其余 36% 属第三国调动。","Expatriation had been a key career step. L’Oréal began recognising local talent development and international team diversity as reasons for assignments and encouraged moves within regions. In 2018 it had 1,050 expatriates, 43% women. Of all expatriates, 34% moved from the French operation, 30% moved to headquarters in France, and 36% were third-country nationals."],"analysis":["升任高管若依靠长时间外派，双职家庭的伴侣工作和孩子就学都会影响谁能竞争。区域内轮岗提供了另一种积累跨市场经验的路径。","When an executive career depends on relocation, a partner’s career and children’s schooling affect who can compete. Regional moves offer another route to cross-market experience."],"limit":["“从法国派出”指派出单位所在地，不能据此推定 34% 的人是法国公民。材料没有给出区域轮岗者最终获晋升的比例。","A posting from the French operation identifies the sending location and does not establish French citizenship. The case gives no subsequent promotion rate for regional assignees."],"ev":[{"doc":"lo","p":9,"q":"What about my partner’s job?","note":["Le Grand 以伴侣工作和子女就学为例说明双职家庭如何考虑外派。","Le Grand cited partners’ careers and children’s schooling as considerations for dual-career households."]},{"doc":"lo","p":9,"q":"30% of the expat population came from other countries to headquarters in France","note":["这项数据表明跨国路径也包括前往总部。","International moves included assignments into headquarters."]}]},{"id":"lateral","label":["怎样让外聘高管融入并保留不同意见？","How can lateral hires learn the culture and still disagree?"],"fact":["全球高管发展负责人每年为进入集团前 250 岗位的约 20–25 名新任者设计融入方案。外聘高管配有同级伙伴、资深导师和外部教练。Roos 负责德国业务时质疑一次染发产品上市计划，后来把专业美发事业部的年度会议改成可参与的策略工作坊。","The global executive development leader tailored integration plans for 20–25 people a year joining the top 250. Outside hires were assigned a peer buddy, senior mentor and external coach. As Germany’s head, Roos challenged a planned hair-colour launch. Later she changed her division’s annual meeting into participatory strategy workshops."],"analysis":["同级伙伴可解释习惯，导师可指出谁有决策权，教练提供私下讨论空间。管理层愿意让新人改变既有做法，才给外部视角留下用武之地。","Peers can explain unwritten habits, mentors can identify decision makers, and coaches offer private advice. Leaders put an outsider’s perspective to use when they allow established practices to be challenged."],"limit":["案例展示一个主管实际改变会议形式。没有披露全体外聘者的留任率，或不同融入安排之间的成效比较。","The case shows a leader changing a meeting format. It gives no retention rate for lateral hires and no comparison between integration arrangements."],"ev":[{"doc":"lo","p":11,"q":"Outsiders were assigned a buddy, a mentor and a coach.","note":["三种角色分别帮助新人了解公司习惯、获得资深指引和获得外部支持。","The three roles offered cultural guidance, senior advice and outside support."]},{"doc":"lo","p":12,"q":"organized some workshops on owning the strategy","note":["Roos 描述的是已经改变的会议形式。","Roos described a meeting format she had actually changed."]}]},{"id":"representation","label":["哪个层级还有代表性缺口？","At which level does representation thin out?"],"fact":["2017 年女性占 994 个集团关键岗位的 49%，占 241 个战略岗位的 30%。新兴市场贡献约 40% 收入，但其人才仅占集团前 250 名经理的 7%。另一张附表显示，执行委员会女性占比从 2010 年的 21% 升到 2017 年的 33%。","In 2017 women held 49% of 994 group key positions and 30% of 241 strategic positions. Emerging markets contributed roughly 40% of revenue but supplied only 7% of the top 250 managers. A separate exhibit shows women’s share of the executive committee rising from 21% in 2010 to 33% in 2017."],"analysis":["同年度相差 19 个百分点，提示管理层追查从关键岗进入战略岗时，谁被提名、谁被任命。新兴市场的收入与高层来源之比，提出的是总部能否充分听见当地声音的问题。","The 19-point difference suggests examining who is nominated and appointed to strategic roles. The comparison between emerging-market sales and leadership origins raises a separate question about local voice at headquarters."],"limit":["关键岗位统计明确排除战略岗位与执行委员会。这是不同岗位群的截面，不是同批人的晋升率。收入份额与经理份额也使用不同分母。","Group key positions exclude strategic positions and the executive committee. These snapshots cover separate job groups, not the promotion rate of a cohort. Revenue shares and manager shares also have different denominators."],"ev":[{"doc":"lo","p":16,"q":"Strategic and Group Key Positions in 2017","note":["附表 3a 的女性栏为战略岗 30%、集团关键岗 49%；两组样本分别为 241、994。","Exhibit 3a reports 30% women in 241 strategic positions and 49% in 994 group key positions."]},{"doc":"lo","p":1,"q":"7% of the top 250 managers came from those markets","note":["这里的新兴市场由案例正文定义，与该段约 40% 的收入份额对应。","The narrative compares this leadership-origin statistic with roughly 40% of revenue."]},{"doc":"lo","p":21,"q":"Executive Committee 21% 33%","note":["附表 9 按 2010、2017 两年排列。","Exhibit 9 lists 2010 and 2017 in that order."]}]}],"prework":[{"id":"pre1","label":["两家公司实施了哪些 DE&I 举措？","What has each company done about DE&I?"],"fact":["列出博世与欧莱雅已经实施的举措，说明分别服务于哪些员工、改变了哪一步工作流程。","Identify the initiatives Bosch and L’Oréal actually implemented, whom they served and which decisions or processes they changed."],"analysis":["博世 HR Lab 让员工选择同事提供绩效反馈，并在特定项目中参与选择主管和队友。DigiTalent 为技术专家开辟与管理岗并行的晋升路径。欧莱雅把包容行为培训交给各地团队实施，又通过员工网络、高层举荐与国际岗位安排帮助人才进入领导层。一个改岗位和团队规则，一个同时改人员培养与任用。","Bosch’s HR Lab let employees choose colleagues to give performance feedback and help select supervisors and peers on particular projects. DigiTalent opened a technical career track alongside management. L’Oréal’s country teams ran inclusion workshops, while networks, senior sponsors and international assignments helped people move toward leadership. Map each initiative to a particular decision about work or advancement."],"limit":["要分开记录覆盖人数、实际获得的机会和后续晋升。例如，参加培训可以证明项目已触达员工，能否改变任用仍要看决策记录。","Record participation, access to opportunities and later advancement separately. Training attendance establishes reach. Appointment records would show whether selection decisions changed."],"ev":[{"doc":"pw","p":1,"q":"What have been done by the BOSCH and L‘Oréal about DE&I","note":["预习单第 1 题。","Pre-work question 1."]},{"doc":"be","p":5,"q":"employees the right to choose their immediate supervisors and coworkers for specific projects","note":["HR Lab 的项目组队试验赋予员工选择权。","Team Staffing gave employees a say in project teams."]},{"doc":"be","p":7,"q":"remuneration, status, and career development opportunities as managers","note":["案例描述了数字技术专家的发展路径与待遇。","The case describes the opportunities and status available to technical specialists."]},{"doc":"lo","p":6,"q":"The workshops had a common curriculum but were adapted to each location.","note":["各地在共享课程基础上调整工作坊。","Countries adapted a common workshop curriculum."]},{"doc":"lo","p":13,"q":"so that I could support her when my voice was relevant","note":["高层导师讲述如何在关键会议上支持 Roos。","A senior mentor describes speaking up for Roos in consequential meetings."]}]},{"id":"pre2","label":["为什么医疗与科技行业需要 DE&I？","Why does DE&I matter in healthcare and technology?"],"fact":["解释医疗与科技行业为何重视 DE&I，两家企业为何相信其价值，以及推行时遇到的困难和跨文化障碍。","Explain the relevance of DE&I to healthcare and technology, the rationale at both firms, and the practical and cross-cultural barriers to implementation."],"analysis":["博世押注物联网，若总部工程师难以听到当地用户或软件人才的意见，产品需求就可能定义得太窄。欧莱雅的“美丽属于所有人”同样要求管理者理解不同顾客的发质、使用场景与审美。迁移到医疗，可追问护理流程是否听得到不同语言患者和一线护士的意见。共同难点在于，谁有权决定哪些经验值得采纳。","Bosch’s IoT effort relied on hearing local users and software specialists when defining a product. L’Oréal’s Beauty for All mission demanded attention to different customers’ hair, routines and preferences. In a healthcare discussion, ask whether multilingual patients and frontline nurses can shape a care pathway. In each setting, who decides which experience counts?"],"limit":["博世是工业科技企业，欧莱雅是美妆企业。医疗属于课堂迁移。国籍不能预测个人偏好，改进服务、创新或利润的因果关系也需要独立验证。","Bosch provides an industrial technology case and L’Oréal a beauty case. Healthcare is a classroom application. Check local needs directly and look for separate evidence of an effect on service, innovation or profit."],"ev":[{"doc":"pw","p":1,"q":"also relating to cross cultural perspectives","note":["第 2 题明确要求跨文化分析。","Question 2 explicitly asks for a cross-cultural perspective."]},{"doc":"be","p":4,"q":"they could finally communicate customer needs to someone from HQ","note":["李晓虹走访业务单元后，一线员工能向总部表达顾客需求。","Lee’s visits gave local staff a route to tell headquarters about customer needs."]},{"doc":"lo","p":8,"q":"the consumer is always right","note":["管理者以了解顾客解释团队背景多样的重要性。","A manager links a wider range of perspectives to curiosity about customers."]},{"doc":"lo","p":13,"q":"The business of beauty is by essence linked to diversity.","note":["欧莱雅人力资源负责人对行业诉求的判断。","The head of HR explains why he sees diversity as relevant to beauty."]}]},{"id":"pre3","label":["举措为何相似，结果为何有别？","What do the initiatives share, and why might outcomes differ?"],"fact":["比较两家企业的共性、差异及可能原因，指出哪些有效、哪些需改进，并解释为何出现不同结果。","Compare common and differing initiatives, explain possible reasons, and assess what worked, what could improve and why outcomes differed."],"analysis":["两家都让高层领导出面支持新人才。博世面对硬件团队向软件转型，先改技术岗位与薪酬。欧莱雅面对长期内部培养的高管结构，先让不同背景的人获得总部视野与关键岗位。观察成效时，博世至 2019 年有六项 HR Lab 方案落地，发展导航受数据保护和 IT 条件限制，中文版记载 HR Lab 于 2019 年初暂停，一些已推出的产品仍在使用。欧莱雅执委会女性占比从 2010 年 21% 升至 2017 年 33%，但高级职位对新兴市场人才仍有门槛。","Both firms enlisted senior leaders. Bosch’s move from hardware into software made technical careers and pay urgent. L’Oréal’s tradition of promoting insiders made access to headquarters and powerful roles a priority. Bosch implemented six HR Lab initiatives by 2019, while data and IT constraints stopped Development Navigator. The Chinese case adds that the Lab paused in early 2019 and some tools remained in use. Women’s representation on L’Oréal’s executive committee rose from 21% in 2010 to 33% in 2017, yet emerging-market leaders still faced barriers."],"limit":["六项落地是实施数量，33% 是高层构成，两者衡量不同结果。可分别追问博世新旧员工的留任，以及欧莱雅进入战略岗的候选人次与晋升概率。","Six implementations count activities. A 33% share describes representation. Compare like outcomes by asking about incumbent retention at Bosch and the odds of moving into strategic roles at L’Oréal."],"ev":[{"doc":"pw","p":1,"q":"the reasons behind the different outcome","note":["第 3 题要求解释成果的差异。","Question 3 asks for reasons behind the different outcomes."]},{"doc":"be","p":5,"q":"By 2019, six initiatives were fully implemented","note":["博世以方案落地数量记录进展。","The implementation count is a Bosch process measure."]},{"doc":"bc","p":7,"q":"数据保护和 IT基础架构无法支撑","note":["中文版说明发展导航受阻的条件。","The Chinese case identifies data protection and IT as constraints on Development Navigator."]},{"doc":"bc","p":7,"q":"HR Lab 按下了暂停键。","note":["中文版补充说明暂停的原因是业务增长效果未经证实、内部 IT 支持有限。","The Chinese case adds that business growth had not been demonstrated and internal IT support was limited."]},{"doc":"lo","p":21,"q":"Executive Committee 21% 33%","note":["附表 9 对照 2010 年和 2017 年的高管女性比例。","Exhibit 9 compares the executive committee’s female share in 2010 and 2017."]},{"doc":"lo","p":8,"q":"a strong pipeline of emerging markets talents","note":["欧莱雅当时仍将新兴市场人才梯队视为改进重点。","The HR leader identified the emerging-market pipeline as an area for further work."]}]},{"id":"pre4","label":["如何培养医疗与科技行业代表不足的人才？","How can healthcare and tech develop underrepresented talent?"],"fact":["解释两家公司如何建设人才梯队，并提出适用于医疗与科技公司的方法，讨论题中所举的亚裔、黑人、印度及其他文化背景。","Explain how both firms built their pipelines. Apply the analysis to healthcare and tech, considering Asian, Black, Indian and other cultural backgrounds named in the prompt."],"analysis":["博世让技术员工从初级岗升到首席专家，有技能的员工也可通过 Skill Hub 参加项目。欧莱雅亚太区负责人定期审视继任名单，印度籍高管 Sharma 后来负责英国业务。行业应用可以从一个卡点入手。医院比较具备同等资格的员工谁能获得专科轮岗，科技企业比较谁能负责核心产品模块；然后公开资格、指定愿意举荐候选人的主管，并追踪接任机会。","Bosch created a route from junior technical roles to chief expert and matched people to project work through its Skill Hub. L’Oréal’s Asia-Pacific head reviewed succession pipelines, and Indian executive Vismay Sharma later led the UK business. A hospital could examine who gets specialty rotations among equally eligible staff. A tech firm could examine who owns core product modules. Publish eligibility criteria, name sponsors and follow candidates through to appointment."],"limit":["在当地、具体职级和岗位上识别低代表性。亚裔与印度籍可能交叠；国籍、族裔、数字技能是不同维度。两案没有按题中全部群体报告晋升结果。","Define underrepresentation for the location, occupation and grade. Asian identity and Indian nationality may overlap, while nationality, ethnicity and digital skills describe different things. The cases do not report advancement rates for every group named in the prompt."],"ev":[{"doc":"pw","p":1,"q":"minorities (such as Asian, Black, Indian and other cultures)","note":["第 4 题列举的群体及人才梯队要求。","Question 4 names these groups when asking about pipelines."]},{"doc":"be","p":7,"q":"chief expert","note":["博世在技术职系设置首席专家这一终点。","Chief expert was a destination on the specialist track."]},{"doc":"be","p":7,"q":"assign tasks to Skill Hub members","note":["按技能匹配真实项目任务。","Project owners could draw on the skills of community members."]},{"doc":"lo","p":8,"q":"a succession plan meeting for each division and corporate function three to four times","note":["亚太区负责人描述定期继任评估。","The Asia-Pacific leader describes recurring succession reviews."]},{"doc":"lo","p":13,"q":"Asian to be appointed as Head of UK","note":["Sharma 的任用是一个可追溯的具体个案。","Sharma’s appointment is one documented outcome."]}]},{"id":"pre5","label":["高管和人才发展团队下一步该做什么？","What should senior management and talent development do next?"],"fact":["分析两家现有举措，建议高层管理者及人才发展团队如何进一步改善职场 DE&I。","Evaluate each firm’s initiatives and recommend next steps for senior managers and talent-development teams to advance workplace DE&I."],"analysis":["博世可由业务负责人和 HR 共同抽查同岗同技能的新员工与在职员工薪酬，解释市场溢价，对持续的失衡分期修正，同时保留专家通道。欧莱雅可在每轮继任会议记录谁获提名、谁有机会负责损益、谁为候选人举荐，并为需要照护家人的员工提供可替代的跨地区任务。季度复盘由拥有预算和任用权的人主持。","At Bosch, business leaders and HR could review new-hire and incumbent pay within comparable roles and skill levels, explain market premiums and phase in corrections while retaining the expert path. At L’Oréal, record nominations, sponsorship and access to profit-and-loss responsibility at succession reviews. Offer cross-market assignments compatible with care commitments. Give the quarterly review to leaders who can change pay and appointments."],"limit":["薪酬差异也可能反映技能和市场价格，需先按可比岗位核查。欧莱雅要查明跨境经验究竟培养了哪项能力，再判断替代任务是否提供同等学习机会。","Compare roles and skills before attributing a pay difference to inequity. Identify what an overseas posting teaches before treating a different assignment as an equivalent development opportunity."],"ev":[{"doc":"pw","p":1,"q":"how the Senior Management including talent development can further advance them","note":["第 5 题的建议对象。","Question 5 specifies the intended decision-makers."]},{"doc":"be","p":8,"q":"New employees generally earned more than existing employees","note":["博世的新旧员工薪酬冲突使薪酬审核具有现实对象。","The new-hire premium is a concrete starting point for a pay review."]},{"doc":"lo","p":9,"q":"expatriation had traditionally been a key step","note":["传统外派要求会影响领导岗位的路径。","Expatriation traditionally mattered for advancement."]},{"doc":"lo","p":12,"q":"to oversee a P&L of 12 million is a risk.","note":["Le Grand 描述管理者在授权损益责任时的风险判断。","Le Grand describes how managers assess the risk of giving someone P&L responsibility."]}]},{"id":"pre6","label":["从你的文化视角，怎样判断改善真的发生了？","From your cultural perspective, how would you tell whether inclusion improved?"],"fact":["结合自己的文化经历，说明障碍及成因。给出领导者应改变的做法、理由、行动计划和 KPI，并定义一个 DE&I 已发挥作用的职场。","Use your own cultural perspective to identify barriers and causes. Justify a specific change for leaders, give an action plan with KPIs and define a workplace where DE&I serves its purpose."],"analysis":["练习示例：如果关键决定常在下班后社交时形成，未能出席者会比别人更晚获得信息。请换成你亲历的场景。第一个月主管查 10 次项目任命，记录候选人来源；第二个月在会前公布标准并开放书面提名；第三个月复查新增提名是否进入面谈。KPI 可用「获得面谈的合资格提名者 ÷ 合资格提名者」，再匿名追问员工是否能提出异议而不承担不利后果。成功意味着员工有渠道获知机会、得到公正考虑、对判断提出异议并收到回应。","Practice example: when decisions take shape at after-hours events, people unable to attend may hear about opportunities too late. Substitute an experience of your own. In month one, the manager reviews ten appointments and records who nominated each candidate. In month two, publish criteria and accept written nominations before meetings. In month three, compare interviews per eligible nominee and ask anonymously whether staff can disagree without adverse consequences. Success means people can learn of opportunities, receive fair consideration, challenge a decision and get a response."],"limit":["自行交代场景、角色与另一种可能解释。KPI 按相同资格和岗位比较，先记录基线；小群体可合并期数或用访谈核实，保护身份。不要代言一个地区或族裔。","Describe your setting and role and consider another explanation. Compare similarly eligible nominees against a baseline. Pool periods or use interviews when groups are small enough to identify individuals. Speak only for your experience."],"ev":[{"doc":"pw","p":1,"q":"justification and action plan and KPI to measure","note":["第 6 题要求行动理由、执行方案与衡量指标。","Question 6 requests justification, actions and measurement."]},{"doc":"bc","p":7,"q":"工作上的讨论，是他们在球场上达成","note":["李晓虹对球场社交与决策的个人观察。","Rosa Lee reflected on work discussions that happened on the golf course."]},{"doc":"lo","p":7,"q":"we still have male networks at the top of the firm","note":["受访员工描述非正式网络与晋升障碍。","An interviewee describes informal networks near the top."]}]},{"id":"pre7","label":["哪些领导力与组织行为启发可用于本地及全球？","Which leadership and organizational behavior lessons travel across contexts?"],"fact":["概括两案对领导力、DE&I 与组织行为的启发，讨论在本地、全球、当下和未来可以怎样行动。","Draw lessons about leadership, DE&I and organizational behavior. Discuss how they apply locally and globally, now and in the future."],"analysis":["从领导者行为看，李晓虹走进业务单元听客户需求，欧莱雅导师在会前与 Roos 对齐观点，并在关键时刻公开支持她。前者改善一线发声的渠道，后者改变有权者听见异议的条件。本地团队可以从一次真实的任命或产品决定入手，追踪谁提出不同观点、谁回应。全球团队可统一机会和结果的定义，允许各地按实际障碍选择做法；下一轮看曾被忽略的建议是否真的改变了决定。","Lee visited business units to hear customers’ needs. A L’Oréal mentor met Roos before an important meeting and backed her when his voice could help. One opened a channel for frontline voices. The other helped a dissenting view reach decision-makers. Locally, follow one appointment or product decision from suggestion to response. Globally, agree on what access and outcomes mean, adapt interventions to local barriers, and review whether previously overlooked input changed a later decision."],"limit":["比较的是特定决策过程。行动是否有用，要结合员工的反馈和真实任用或业务选择来判断。预习单附页的时尚业调查与 Levi’s 做法只能作跨行业参照。","These examples concern specific decisions. Check employee accounts against appointments or decisions actually made. The pre-work’s fashion survey and Levi’s examples provide comparisons from another industry."],"ev":[{"doc":"pw","p":1,"q":"Additional insights for today and future related locally and globally","note":["第 7 题的时间和地理范围。","Question 7 asks for local and global lessons for today and the future."]},{"doc":"be","p":4,"q":"Lee visited every unit in person","note":["直接听取业务单元意见，是可以观察的领导者行为。","Visits to local units are an observable leadership behavior."]},{"doc":"lo","p":13,"q":"I spent a lot of time laying the groundwork to support her.","note":["Zaumseil 说明他如何为外部加入的 Roos 建立支持。","Zaumseil explains how he supported Roos after she joined from outside."]},{"doc":"pw","p":4,"q":"diversity results focusing on representation such as hiring and promotion","note":["预习单所附教学材料把人员构成与员工日常体验分开衡量。","The supplementary teaching excerpt distinguishes representation measures from employees’ daily experience."]}]}],"charts":[{"id":"women-trend","title":["女性在三类领导岗位中的占比","Women’s representation in three leadership groups"],"series":[["2010 年","2010"],["2017 年","2017"]],"unit":"%","rows":[{"label":["执行委员会","Executive committee"],"values":[21,33]},{"label":["管理委员会","Management committees"],"values":[39,48]},{"label":["全球品牌总经理","Global brand general managers"],"values":[43,62]}],"note":["附表 9 比较同类岗位在两个时点的女性占比。增幅依次为 12、9、19 个百分点；案例没有将变化归因于某项单独措施。","Exhibit 9 compares women’s representation in each role at two dates. The increases were 12, 9 and 19 percentage points respectively. The case does not attribute them to any single initiative."],"ev":[{"doc":"lo","p":21,"q":"Global Brand General Managers 43% 62%","note":["附表 9 以 2010 和 2017 为列；每行分母是该类岗位。","Exhibit 9 uses 2010 and 2017 columns. Each percentage refers to the named role group."]}]},{"id":"role-mix","title":["2017 年两类集团岗位的人员构成","Composition of two role groups in 2017"],"series":[["集团关键岗（994 个）","Group key positions (994)"],["战略岗（241 个）","Strategic positions (241)"]],"unit":"%","rows":[{"label":["女性","Women"],"values":[49,30]},{"label":["法国籍","French nationals"],"values":[40,61]},{"label":["外派人员","Expatriates"],"values":[26,32]},{"label":["外部招聘后一年内获任命","External recruits appointed within a year"],"values":[14,11]}],"note":["附表 3a 的集团关键岗统计排除战略岗与执行委员会。每个比例的分母是本列岗位总数；同一人可以同时属于多行，不能相加。外招指标仅包含入职后不到 12 个月就获任命者。","Exhibit 3a excludes strategic positions and the executive committee from group key positions. Percentages use each column’s role count. Categories can overlap. External recruits here were appointed less than 12 months after joining."],"ev":[{"doc":"lo","p":16,"q":"Strategic and Group Key Positions in 2017","note":["女性、法国籍、外派与外招比例分别取自附表 3a 的对应列。","Figures come from the Female, French, Expat and External Recruits columns of Exhibit 3a."]}]}],"cross":[{"id":"entry","label":["谁能进入候选名单？","Who gets considered?"],"left":["关键岗位每四名候选人中至少有一位女性。","At least one in four candidates for key posts must be a woman."],"right":["区域负责人反复审视继任名单，并向巴黎推荐当地人才。","Regional leaders review succession lists and put local talent forward to Paris."],"analysis":["两家都干预选人之前的提名环节。比较入围与最终任命，才能知道新增机会走了多远。","Both intervene before appointments are made. Compare nominations with appointments to see how far the extra opportunity extends."],"refs":["women","regional-pipeline"]},{"id":"voice-route","label":["谁的意见能进入决定？","Whose voice reaches the decision?"],"left":["李晓虹让博克直接向有审批权的人解释为何需要两个 IT 岗位。","Rosa Lee gave Boecker access to the people who could approve two IT positions."],"right":["资深导师在关键会议前与外聘高管 Roos 讨论观点，并在需要时支持她。","A senior mentor discussed Roos’s proposals with her before an important meeting and could support her when it mattered."],"analysis":["两人都改变了意见被听见的条件。可追问提案随后获得什么资源、改变了哪个决定。","Both leaders changed who could be heard. Trace what resources a proposal secured or which decision it changed."],"refs":["connectory","lateral","pre7"]},{"id":"mobility-route","label":["哪里的经验算数？","Which experience counts?"],"left":["李晓虹在德国总部走访业务部门，也希望中国管理者能承担全球职责。","At German headquarters, Lee sought out operating teams. She wanted more Chinese managers to take on global responsibility."],"right":["欧莱雅通过跨国任职培养高管。区域内调动给双职家庭提供了另一条积累经验的路径。","International assignments developed leaders. Moves within a region offered another route to cross-market experience for dual-career households."],"analysis":["考察外派要求究竟培养了什么能力，以及员工是否还有其他途径证明这项能力。","Ask what an assignment is meant to teach and how else an employee could demonstrate that capability."],"refs":["glocal","mobility"]},{"id":"career-route","label":["怎样留住人才？","What keeps talent in the organization?"],"left":["数字专家可走技术晋升通道，但新人与在职员工之间的薪差引起质疑。","Digital experts can advance on a technical track. Differences between new-hire and incumbent pay drew objections."],"right":["部分地区从离职面谈中看到照护压力，采用家长互助、导师支持与弹性工作。","Exit interviews in some markets exposed care pressures. Local responses included parent networks, mentoring and flexible work."],"analysis":["两边的离职机制可能不同。分别观察同岗薪差与育儿后回岗、任用情况，再选择干预手段。","The reasons for leaving may differ. Examine comparable-role pay on one side and return-to-work and appointments after parenthood on the other."],"refs":["paygap","digital","gender-progression"]},{"id":"effect","label":["怎么知道措施有效？","What would count as success?"],"left":["HR Lab 有产品落地，也有项目受技术限制。中文材料还记录了实验室的暂停。","Some HR Lab tools went live, while technical constraints halted another. The Chinese edition also records the lab’s suspension."],"right":["执行委员会女性占比从 2010 年的 21% 升至 2017 年的 33%。","Women’s representation on the executive committee rose from 21% in 2010 to 33% in 2017."],"analysis":["项目落地、人员构成变化和经营成效分别回答不同问题。两案都缺乏将变化归因于某一项目所需的对照。","Implementation, representation and business outcomes answer different questions. Neither case offers a comparison that isolates the effect of one initiative."],"refs":["lab","women-trend"]}]}; const ART="<svg viewBox=\"0 0 460 190\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs><pattern id=\"dots\" width=\"13\" height=\"13\" patternUnits=\"userSpaceOnUse\"><circle cx=\"3\" cy=\"3\" r=\".8\" fill=\"#719184\"/><\/pattern><g id=\"seat\"><path d=\"M-15 8C-16 1-12-10-6-13Q0-16 6-13C12-10 16 1 15 8Q0 15-15 8Z\" fill=\"currentColor\"/><ellipse cy=\"-12\" rx=\"7\" ry=\"7.5\" fill=\"currentColor\" stroke=\"#1e4238\" stroke-width=\"1.8\"/><\/g><\/defs><rect width=\"460\" height=\"190\" fill=\"url(#dots)\" opacity=\".5\"/><g transform=\"translate(231 105)\"><ellipse rx=\"130\" ry=\" function prework(){return lead(tr('课前七问','Seven prework questions'),tr('按预习单的原有顺序展开。先试着用自己的话回答，再查看两家公司的例证、可讨论的解释和证据边界。','Follow the order of the prework sheet. Form your own answer, then compare it with the case examples, possible interpretations and limits of the evidence.'))+
 '<section class="panel" data-anchor="brief">'+head('calendar',tr('课堂准备要求','Class preparation'),pageBtn('pw',1,tr('任务单第 1 页','Prework sheet, p. 1')))+'<p>'+tr('个人先阅读案例、查找补充资料并写下观点或疑问。组长整合成 PPT，组织课堂讨论。每组展示最多 20 分钟，课前或上课当天将 PPT 发给老师。','Read the cases, research relevant additional material, and write down individual insights or questions. Group leaders consolidate the work into slides and lead discussion. Each group has up to 20 minutes. Email the slides to the teacher on or before the lecture.')+'</p></section><div class="topspace">'+DATA.prework.map((r,i)=>{const on=S.open.has(r.id);return '<article class="qbox" data-anchor="q-'+r.id+'"><button class="qbtn" data-q="'+r.id+'" aria-expanded="'+on+'" aria-controls="answer-'+r.id+'"><span class="qidx">Q'+(i+1)+'</span><strong>'+E(r.label)+'</strong>'+ic('down',16)+'</button><div class="qbody" id="answer-'+r.id+'" '+(on?'':'hidden')+'>'+field(tr('题目要求','What the question asks'),T(r.fact))+field(tr('参考解析','Worked interpretation'),T(r.analysis))+field(tr('核查与讨论','What to test or discuss'),T(r.limit))+cite(r.id,tr('查看题目及案例依据','See the prompt and evidence'))+'</div></article>'}).join('')+'</div>'}
function sources(){return lead(tr('原文资料索引','Source library'),tr('下列页码按每份 PDF 自身的顺序计算。每条依据都保留原文语言，旁附当前界面语言的解读。','Page numbers follow each PDF separately. Evidence retains its original language and is accompanied by an interpretation in the selected interface language.'))+'<div class="grid2">'+Object.entries(documents).map(([key,v])=>'<article class="panel source" data-anchor="doc-'+key+'"><div class="tag">'+ic('doc',15)+E(v.name)+' · '+IMAGES[key].length+tr(' 页',' pages')+'</div><h2>'+E(v.title)+'</h2><p>'+E(v.desc)+'</p>'+pageBtn(key,1,tr('打开原页','Open source pages'))+'</article>').join('')+'</div>'}
function renderMain(){$('#content').innerHTML=({overview,bosch:()=>caseView('bosch'),loreal:()=>caseView('loreal'),compare,prework,sources})[S.tab]()}
function paint(){chrome();renderMain()}
const dialog=$('#dialog');let sourceOpener=null;
function record(id){
 const orig=allitems[id];if(orig)return orig;
 const x=DATA.cross.find(r=>r.id===id);if(!x)return null;
 const seen=new Set(),ev=[];
 for(const key of x.refs){for(const e of allitems[key].ev){
  if(e.doc==='pw')continue;const code=e.doc+e.p+e.q;if(!seen.has(code)){seen.add(code);ev.push(e)}
 }}
 return {...x,ev};
}
function textSources(row){
 return row.ev.map((e,i)=>({e,i})).sort((a,b)=>{const rank=k=>(k==='pw'?0:k===(S.en?'be':'bc')?1:k===(S.en?'bc':'be')?2:3);return rank(a.e.doc)-rank(b.e.doc)||a.i-b.i});
}
function showDialog(state){
 if(!dialog.open)sourceOpener=document.activeElement;
 S.d=state;drawDialog();if(!dialog.open)dialog.showModal();
 (state.type==='page'?$('#pagepick'):$('#dialog [data-close]')).focus({preventScroll:true});
}
function drawDialog(){
 const d=S.d;if(!d)return;
 const isPage=d.type==='page';
 let h='<div class="dhead"><span class="crumb">'+ic(isPage?'doc':'book',16)+tr(isPage?'PDF 原页':'解析与依据',isPage?'Source page':'Interpretation and evidence')+'</span><div class="dtools">'+lang()+'<button class="iconbtn" data-close aria-label="'+tr('关闭','Close')+'">'+ic('close',17)+'</button></div></div>';
 if(!isPage){
  const r=record(d.id);
  h+='<div class="dscroll"><h2 id="dt">'+E(r.label||r.title)+'</h2><div class="dbody">'+(r.fact?field(r.id.startsWith('pre')?tr('题目要求','What the question asks'):tr('案例事实','Case facts'),T(r.fact)):'')+field(tr('解析','Interpretation'),T(r.analysis||r.note))+(r.limit?field(tr('证据边界','Limits of the evidence'),T(r.limit)):'')+'</div>'+
  textSources(r).map(({e,i})=>'<section class="qsource" data-si="'+i+'"><div class="spread"><b>'+E(documents[e.doc].name)+' · '+pg(e.p)+'</b>'+pageBtn(e.doc,e.p)+'</div><blockquote lang="'+(e.doc==='bc'?'zh-CN':'en')+'">'+esc(e.q)+'</blockquote><p>'+E(e.note)+'</p></section>').join('')+'</div>';
 }else{
  const doc=documents[d.doc],total=IMAGES[d.doc].length;
  h+='<div class="pghead">'+(d.id?'<button class="linebtn" data-back>'+ic('prev',13)+tr('返回这条依据','Back to this evidence')+'</button>':'')+'<h2 id="dt">'+E(doc.name)+' · '+pg(d.p)+'</h2><div class="pagebar"><button class="iconbtn" data-step="-1" aria-label="'+tr('上一页','Previous page')+'" '+(d.p===1?'disabled':'')+'>'+ic('prev',15)+'</button><button class="iconbtn" data-step="1" aria-label="'+tr('下一页','Next page')+'" '+(d.p===total?'disabled':'')+'>'+ic('next',15)+'</button><select id="pagepick" aria-label="'+tr('选择页码','Select page')+'">'+IMAGES[d.doc].map((_,i)=>'<option value="'+(i+1)+'" '+(i+1===d.p?'selected':'')+'>'+pg(i+1)+' / '+total+'</option>').join('')+'</select><button data-zoom class="smallbtn" aria-pressed="'+d.zoom+'">'+ic('zoom',14)+tr(d.zoom?'适合宽度':'放大',d.zoom?'Fit to width':'Zoom in')+'</button></div></div><div class="imageview '+(d.zoom?'zoomed':'')+'" tabindex="0" aria-label="'+tr('原页图像','Source page image')+'"><img id="srcimage" width="'+(d.doc==='be'||d.doc==='bc'?1174:1207)+'" src="'+esc(IMAGES[d.doc][d.p-1])+'" alt="'+E(doc.name)+' · '+pg(d.p)+'"><p class="fail" hidden>'+tr('本页图片载入失败。可重试载入。','This page image could not be loaded. Try again.')+' <button class="smallbtn" data-retry>'+tr('重试','Retry')+'</button></p></div>';
 }
 $('#dialogbody').innerHTML=h;
 const img=$('#srcimage');if(img){img.onerror=()=>{$('.imageview .fail').hidden=false};if(img.complete&&!img.naturalWidth)img.onerror()}
}
function sourcePage(doc,p,section){
 const old=S.d,fromEvidence=old?.type==='ev';const state={type:'page',doc,p:Math.min(IMAGES[doc].length,Math.max(1,p)),zoom:false,id:old?.id||null,si:section??old?.si??null,offset:fromEvidence?$('.dscroll').scrollTop:old?.offset||0};
 showDialog(state);
}
function focusData(key,value,root=document){root.querySelector('[data-'+key+'="'+CSS.escape(String(value))+'"]')?.focus({preventScroll:true})}
function readingAnchor(){
 if(scrollY<=2)return null;const top=$('#nav').getBoundingClientRect().bottom+4,nodes=[...document.querySelectorAll('#content [data-anchor]')].map(n=>({n,r:n.getBoundingClientRect()}));
 const close=nodes.filter(x=>Math.abs(x.r.top-top)<25).sort((a,b)=>Math.abs(a.r.top-top)-Math.abs(b.r.top-top));
 const found=close[0]||nodes.filter(x=>x.r.top<=top&&x.r.bottom>top).pop()||nodes.find(x=>x.r.top>top);
 return found&&{key:found.n.dataset.anchor,top:found.r.top};
}
function changeLang(en){
 if(en===S.en)return;const a=readingAnchor(),x=$('.navs').scrollLeft;const pane=$('.dscroll')||$('.imageview');const oldy=pane?.scrollTop||0,oldx=pane?.scrollLeft||0;
 const activeRef=pane&&S.d?.type==='ev'&&oldy>0?[...pane.querySelectorAll('[data-si]')].find(el=>el.getBoundingClientRect().bottom>pane.getBoundingClientRect().top):null;
 const slot=activeRef?{idx:activeRef.dataset.si,offset:activeRef.getBoundingClientRect().top-pane.getBoundingClientRect().top}:null;
 S.en=en;paint();$('.navs').scrollLeft=x;
 if(a){const el=$('[data-anchor="'+a.key+'"]');if(el)window.scrollBy(0,el.getBoundingClientRect().top-a.top)}
 if(dialog.open){drawDialog();const target=$('.dscroll')||$('.imageview');if(slot){const el=target.querySelector('[data-si="'+slot.idx+'"]');target.scrollTop=el.getBoundingClientRect().top-target.getBoundingClientRect().top-slot.offset}else{target.scrollTop=oldy;target.scrollLeft=oldx}focusData('lang',+en,dialog)}
 else focusData('lang',+en,$('#header'));
}
function navigation(tab,push=true){
 if(!sections.some(r=>r[0]===tab))tab='overview';S.tab=tab;
 if(push&&location.hash!=='#'+tab){try{history.pushState(null,'','#'+tab)}catch{location.hash=tab}}
 paint();window.scrollTo(0,0);const nav=$('.navs'),el=$('#nav .on');if(el&&nav.scrollWidth>nav.clientWidth)nav.scrollLeft=el.offsetLeft-nav.offsetLeft-(nav.clientWidth-el.offsetWidth)/2;
 $('#content').focus({preventScroll:true});
}
document.addEventListener('click',event=>{
 const b=event.target.closest('button');
 if(!b){const row=event.target.closest('[data-row]');if(row&&!window.getSelection()?.toString()){row.querySelector('[data-ev]')?.focus({preventScroll:true});showDialog({type:'ev',id:row.dataset.row})}return}
 const a=b.dataset;
 if('lang' in a){changeLang(a.lang==='1');return}
 if(a.go){navigation(a.go);return}
 if(a.openq){S.open.add(a.openq);navigation('prework');const el=$('[data-q="'+a.openq+'"]');el.scrollIntoView({block:'start'});el.focus({preventScroll:true});return}
 if(a.ev){showDialog({type:'ev',id:a.ev});return}
 if(a.doc){sourcePage(a.doc,+a.p,b.closest('[data-si]')?.dataset.si);return}
 if('close' in a){dialog.close();return}
 if('back' in a){const {id,offset,si}=S.d;showDialog({type:'ev',id});$('.dscroll').scrollTop=offset||0;const btn=$('[data-si="'+si+'"] [data-doc]',dialog);btn?.focus({preventScroll:true});return}
 if(a.step){sourcePage(S.d.doc,S.d.p+Number(a.step));const next=dialog.querySelector('[data-step="'+a.step+'"]:not(:disabled)');(next||$('#pagepick')).focus({preventScroll:true});return}
 if('zoom' in a){S.d.zoom=!S.d.zoom;drawDialog();dialog.querySelector('[data-zoom]').focus({preventScroll:true});return}
 if('retry' in a){drawDialog();return}
 if(a.filter){S.filters[S.tab]=a.filter;renderMain();focusData('filter',a.filter);return}
 if('chart' in a){const y=$('[data-anchor="charts"]').getBoundingClientRect().top;S.chart=Number(a.chart);renderMain();window.scrollBy(0,$('[data-anchor="charts"]').getBoundingClientRect().top-y);focusData('chart',a.chart);return}
 if(a.q){if(S.open.has(a.q))S.open.delete(a.q);else S.open.add(a.q);const y=b.getBoundingClientRect().top;renderMain();window.scrollBy(0,$('[data-q="'+a.q+'"]').getBoundingClientRect().top-y);focusData('q',a.q);return}
});
document.addEventListener('change',e=>{if(e.target.id==='pagepick')sourcePage(S.d.doc,Number(e.target.value))});
dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});
dialog.addEventListener('close',()=>{const d=S.d;S.d=null;if(sourceOpener?.isConnected)sourceOpener.focus({preventScroll:true});else if(d?.id)focusData('ev',d.id,$('#content'));else if(d?.doc)focusData('doc',d.doc,$('#content'));sourceOpener=null});
window.addEventListener('popstate',()=>navigation(location.hash.slice(1),false));
paint();
</script></body></html>
